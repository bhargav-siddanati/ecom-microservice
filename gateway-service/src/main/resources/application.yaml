spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/user/**
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/product/**
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/order/**,/api/cart/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      propability: 1.0