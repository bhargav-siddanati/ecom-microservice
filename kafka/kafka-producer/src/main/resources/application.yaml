spring:
  application:
    name: kafka-producer
  cloud:
    function:
      definition: sendRiderLocation
    stream:
      function:
        definition: sendRiderLocation
      bindings:
        sendRiderLocation-out-0:
          destination: my-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092





